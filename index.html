<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1b1038">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>bee_citations</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#1b1038;--panel:#2a1b52;--ink:#fff;--mute:#b6a8dd;--bee:#ffc93c;--ui:"Bricolage Grotesque",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--ui);overscroll-behavior:none;user-select:none}
#app{height:100dvh;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding-top:env(safe-area-inset-top)}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 6px}
.logo{font-weight:800;font-size:1.3rem;letter-spacing:-.02em}
.logo em{font-style:normal;color:var(--bee)}
.lang{font:inherit;font-weight:800;font-size:.8rem;border:2px solid var(--bee);color:var(--bee);background:none;border-radius:999px;padding:5px 12px}
.chips{display:flex;gap:8px;padding:8px 18px}
.chips button{font:inherit;font-weight:600;border:0;border-radius:999px;padding:9px 18px;background:var(--panel);color:var(--mute)}
.chips button.on{background:var(--bee);color:#2a1b00}
main{flex:1;overflow-y:auto;padding:6px 18px 18px;scrollbar-width:none}
main::-webkit-scrollbar{display:none}
.view{display:none}.view.on{display:block}
.big{border-radius:28px;padding:28px 24px;min-height:50dvh;display:flex;flex-direction:column;justify-content:space-between;gap:26px;box-shadow:0 14px 40px rgba(0,0,0,.35);transition:transform .25s,opacity .25s}
.big.out{transform:translateX(-30px);opacity:0}
.big q{quotes:none;font-weight:800;font-size:clamp(1.4rem,6.4vw,2rem);line-height:1.22;letter-spacing:-.015em;text-shadow:0 1px 10px rgba(0,0,0,.25)}
.who b{display:block;font-size:1.1rem}.who span{opacity:.85;font-size:.95rem}
.acts{display:flex;justify-content:center;gap:14px;padding:20px 0 6px}
.round{width:56px;height:56px;border-radius:50%;border:0;background:var(--panel);color:var(--ink);font-size:1.4rem}
.round.next{width:72px;height:72px;background:var(--bee);color:#2a1b00;font-size:1.8rem}
.round.fav.on{background:#ff3d71}
.round:active,.chips button:active,.nav button:active{transform:scale(.93)}
.search{display:flex;gap:8px;margin:4px 0 14px;flex-wrap:wrap}
.search select,.search input{font:inherit;border:0;border-radius:14px;background:var(--panel);color:var(--ink);padding:13px 14px;user-select:text}
.search input{flex:1;min-width:150px}.search input::placeholder{color:var(--mute)}
.search button{font:inherit;font-weight:800;border:0;border-radius:14px;background:var(--bee);color:#2a1b00;padding:0 18px}
.list{display:grid;gap:14px}
.card{border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.card q{quotes:none;font-weight:600;font-size:1.12rem;line-height:1.35;text-shadow:0 1px 8px rgba(0,0,0,.25)}
.card .ft{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.card .who b{font-size:1rem}.card .who span{font-size:.88rem}
.mini{display:flex;gap:8px}
.mini button{font-size:1.05rem;width:40px;height:40px;border-radius:50%;border:0;background:rgba(0,0,0,.25);color:#fff}
.mini button.on{background:#ff3d71}
.more{display:block;margin:18px auto 6px;font:inherit;font-weight:800;border:0;border-radius:999px;padding:13px 26px;background:var(--panel);color:var(--ink)}
.msg{background:var(--panel);color:var(--mute);border-radius:18px;padding:22px;text-align:center;line-height:1.5}
.skel{height:130px;border-radius:22px;background:linear-gradient(90deg,#2a1b52,#3a2772,#2a1b52);background-size:200% 100%;animation:s 1.1s infinite}
@keyframes s{to{background-position:-200% 0}}
.credit{text-align:center;color:var(--mute);font-size:.78rem;padding:14px 0 4px}
.nav{display:flex;background:var(--panel);padding:8px 10px calc(8px + env(safe-area-inset-bottom));border-radius:22px 22px 0 0}
.nav button{flex:1;border:0;background:none;color:var(--mute);font:inherit;font-weight:600;font-size:.78rem;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px}
.nav button i{font-style:normal;font-size:1.4rem}
.nav button.on{color:var(--bee)}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--bee);color:#2a1b00;font-weight:800;padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--bee);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <div class="top"><div class="logo">bee<em>_</em>citations</div><button class="lang" id="lang">FR</button></div>
  <div class="chips" id="chips">
    <button data-m="anime" class="on">Animé</button>
    <button data-m="other">Autres</button>
  </div>
  <main>
    <section class="view on" id="v-home">
      <div class="big" id="big"><q id="hq">Chargement…</q><div class="who"><b id="hw"></b><span id="hs"></span></div></div>
      <div class="acts">
        <button class="round fav" id="hfav" aria-label="Ajouter aux favoris">♥</button>
        <button class="round next" id="nxt" aria-label="Citation suivante">↻</button>
        <button class="round" id="hcopy" aria-label="Copier">⧉</button>
        <button class="round" id="hshare" aria-label="Partager">⇪</button>
      </div>
      <p class="credit" style="padding-top:4px">Astuce : glisse la carte vers la gauche</p>
    </section>

    <section class="view" id="v-explore">
      <form class="search" id="sf">
        <select id="by" aria-label="Chercher par"><option value="anime">Animé</option><option value="character">Personnage</option></select>
        <input id="q" type="search" placeholder="Naruto, Saitama…" aria-label="Recherche">
        <button type="submit">OK</button>
      </form>
      <div class="list" id="list"></div>
      <button class="more" id="more">Charger plus</button>
    </section>

    <section class="view" id="v-fav">
      <div class="list" id="favs"></div>
    </section>
    <p class="credit" id="credit"></p>
  </main>
  <nav class="nav">
    <button data-v="home" class="on"><i>✨</i>Découvrir</button>
    <button data-v="explore"><i>🔍</i>Explorer</button>
    <button data-v="fav"><i>💛</i>Favoris</button>
  </nav>
</div>
<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const A = "https://api.animechan.io/v1", D = "https://dummyjson.com/quotes";
const GRAD = [["#ff5f6d","#ffa751"],["#7f00ff","#e100ff"],["#0093e9","#3a4bff"],["#00b09b","#2bd96b"],["#f12711","#f5af19"],["#ee0979","#ff6a00"],["#5f2c82","#49a09d"],["#c31432","#7a2a9e"]];
let mode="anime", view="home", by="anime", query="", page=1, skip=0, cur=null, lang=localStorage.getItem("bc:lang")||"fr";
let favs=[]; try{ favs=JSON.parse(localStorage.getItem("bc:fav")||"[]"); }catch(e){}

// ---------- Utilitaires ----------
const grad = q => { let h=0; for(const c of (q.src||q.who)) h=(h*31+c.charCodeAt(0))|0; const g=GRAD[Math.abs(h)%GRAD.length]; return `linear-gradient(145deg,${g[0]},${g[1]})`; };
const isFav = q => favs.some(f => f.t===q.t);
const saveFavs = () => localStorage.setItem("bc:fav", JSON.stringify(favs));
const shown = q => (lang==="fr" && q.fr) ? q.fr : q.t;
const label = q => `« ${shown(q)} » — ${q.who}${q.src?" ("+q.src+")":""}`;
function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),1300); }
async function copy(q){ try{ await navigator.clipboard.writeText(label(q)); toast("Copié"); }catch(e){} }
function share(q){ if(navigator.share) navigator.share({text:label(q)}).catch(()=>{}); else copy(q); }
function toggleFav(q){ if(isFav(q)) favs=favs.filter(f=>f.t!==q.t); else favs.unshift(q); saveFavs(); toast(isFav(q)?"Ajouté aux favoris":"Retiré"); }

// ---------- Réseau ----------
async function get(url, fresh){
  if(!fresh){ try{ const c=sessionStorage.getItem(url); if(c) return JSON.parse(c); }catch(e){} }
  const r = await fetch(url);
  if(r.status===429) throw new Error("limite");
  if(!r.ok) throw new Error("http");
  const j = await r.json();
  try{ sessionStorage.setItem(url, JSON.stringify(j)); }catch(e){}
  return j;
}
const fromA = d => ({t:d.content, who:d.character?.name||"Inconnu", src:d.anime?.name||""});
const fromD = d => ({t:d.quote, who:d.author, src:""});
async function random(){
  if(mode==="anime"){ const p=query?`?${by}=${encodeURIComponent(query)}`:""; return fromA((await get(`${A}/quotes/random${p}`,true)).data); }
  return fromD(await get(`${D}/random`,true));
}
async function list(){
  if(mode==="anime"){
    const p=query?`${by}=${encodeURIComponent(query)}&`:"";
    const j=await get(`${A}/quotes?${p}page=${page}`);
    const arr=Array.isArray(j.data)?j.data:(j.data?.quotes||[]);
    return arr.map(fromA);
  }
  const j=await get(`${D}?limit=6&skip=${skip}`); skip+=6; return (j.quotes||[]).map(fromD);
}

// ---------- Traduction (MyMemory, gratuite) ----------
async function translate(q){
  if(q.fr) return q.fr;
  const k="bc:tr:"+q.t, c=localStorage.getItem(k);
  if(c){ q.fr=c; return c; }
  if(q.t.length>450) return null;
  try{
    const r=await fetch("https://api.mymemory.translated.net/get?q="+encodeURIComponent(q.t)+"&langpair=en|fr");
    const j=await r.json(), v=j.responseData&&j.responseData.translatedText;
    if(String(j.responseStatus)==="200" && v && !/MYMEMORY WARNING/i.test(v)){ localStorage.setItem(k,v); q.fr=v; return v; }
  }catch(e){}
  return null;
}
function withTranslation(q, el){ // affiche l'original puis remplace par le français
  el.textContent = "« "+shown(q)+" »";
  if(lang==="fr" && !q.fr) translate(q).then(v=>{ if(v) el.textContent="« "+v+" »"; });
}

// ---------- Rendu ----------
function errText(e){ return e.message==="limite" ? "Limite de requêtes atteinte pour aujourd'hui. Reviens plus tard." : "Impossible de joindre l'API. Vérifie ta connexion."; }
function makeCard(q, inFav){
  const el=document.createElement("article"); el.className="card"; el.style.background=grad(q);
  el.innerHTML=`<q></q><div class="ft"><div class="who"><b></b><span></span></div><div class="mini"><button class="f" aria-label="Favori">♥</button><button class="c" aria-label="Copier">⧉</button><button class="s" aria-label="Partager">⇪</button></div></div>`;
  withTranslation(q, el.querySelector("q"));
  el.querySelector("b").textContent=q.who; el.querySelector("span").textContent=q.src;
  const f=el.querySelector(".f"); f.classList.toggle("on",isFav(q));
  f.onclick=()=>{ toggleFav(q); f.classList.toggle("on",isFav(q)); if(inFav) renderFavs(); };
  el.querySelector(".c").onclick=()=>copy(q); el.querySelector(".s").onclick=()=>share(q);
  return el;
}
function renderHero(q){
  cur=q; const big=$("big");
  big.style.background=grad(q); withTranslation(q,$("hq"));
  $("hw").textContent=q.who; $("hs").textContent=q.src;
  $("hfav").classList.toggle("on",isFav(q));
}
async function loadHero(){
  const big=$("big"); big.classList.add("out"); $("nxt").disabled=true;
  try{ const q=await random(); setTimeout(()=>{ renderHero(q); big.classList.remove("out"); },180); }
  catch(e){ cur=null; big.style.background="var(--panel)"; $("hq").textContent=errText(e); $("hw").textContent=""; $("hs").textContent=""; big.classList.remove("out"); }
  $("nxt").disabled=false;
}
async function loadList(reset){
  const g=$("list");
  if(reset){ page=1; skip=0; g.innerHTML='<div class="skel"></div>'.repeat(3); }
  $("more").disabled=true;
  try{
    const items=await list();
    if(reset) g.innerHTML="";
    if(reset && !items.length) g.innerHTML='<div class="msg">Aucun résultat. Essaie un autre titre ou personnage.</div>';
    items.forEach(q=>g.appendChild(makeCard(q)));
    page++; $("more").style.display=items.length?"":"none";
  }catch(e){
    if(reset) g.innerHTML="";
    g.insertAdjacentHTML("beforeend",`<div class="msg">${errText(e)}</div>`); $("more").style.display="none";
  }
  $("more").disabled=false;
}
function renderFavs(){
  const g=$("favs"); g.innerHTML="";
  if(!favs.length){ g.innerHTML='<div class="msg">Pas encore de favoris.<br>Touche ♥ sur une citation pour la garder ici.</div>'; return; }
  favs.forEach(q=>g.appendChild(makeCard(q,true)));
}

// ---------- Navigation ----------
function setView(v){
  view=v;
  document.querySelectorAll(".view").forEach(s=>s.classList.toggle("on",s.id==="v-"+v));
  document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
  $("chips").style.display = v==="fav" ? "none" : "";
  if(v==="fav") renderFavs();
  if(v==="explore" && !$("list").children.length) loadList(true);
}
function setMode(m){
  mode=m; query=""; $("q").value="";
  document.querySelectorAll("#chips button").forEach(b=>b.classList.toggle("on",b.dataset.m===m));
  $("sf").style.display = m==="anime" ? "" : "none";
  $("credit").textContent = m==="anime" ? "Données : Animechan · Traduction : MyMemory" : "Données : DummyJSON · Traduction : MyMemory";
  loadHero(); $("list").innerHTML=""; if(view==="explore") loadList(true);
}
document.querySelectorAll("#chips button").forEach(b=>b.onclick=()=>setMode(b.dataset.m));
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>setView(b.dataset.v));
$("sf").onsubmit=e=>{ e.preventDefault(); query=$("q").value.trim(); by=$("by").value; loadHero(); loadList(true); };
$("nxt").onclick=loadHero; $("more").onclick=()=>loadList(false);
$("hcopy").onclick=()=>cur&&copy(cur); $("hshare").onclick=()=>cur&&share(cur);
$("hfav").onclick=()=>{ if(!cur) return; toggleFav(cur); $("hfav").classList.toggle("on",isFav(cur)); };
$("lang").onclick=()=>{ lang = lang==="fr" ? "en" : "fr"; localStorage.setItem("bc:lang",lang); $("lang").textContent=lang.toUpperCase(); if(cur) withTranslation(cur,$("hq")); $("list").innerHTML=""; if(view==="explore") loadList(true); if(view==="fav") renderFavs(); };
$("lang").textContent=lang.toUpperCase();

// Glisser la carte vers la gauche = citation suivante
let sx=null; const big=$("big");
big.addEventListener("touchstart",e=>sx=e.touches[0].clientX,{passive:true});
big.addEventListener("touchend",e=>{ if(sx!==null && e.changedTouches[0].clientX-sx<-60) loadHero(); sx=null; });

// Installable comme application (manifest généré)
try{
  const icon="data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="110" fill="#1b1038"/><text x="256" y="350" font-size="300" text-anchor="middle" fill="#ffc93c" font-family="Georgia">“</text></svg>');
  const m={name:"bee_citations",short_name:"bee_citations",start_url:".",display:"standalone",background_color:"#1b1038",theme_color:"#1b1038",lang:"fr",icons:[{src:icon,sizes:"512x512",type:"image/svg+xml"}]};
  const l=document.createElement("link"); l.rel="manifest"; l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:"application/manifest+json"})); document.head.appendChild(l);
}catch(e){}

setMode("anime");
</script>
</body>
</html>
